# The /tentang-kami page (dist/tentang-kami.html), built by scripts/blog/build.ts and checked
# against scripts/blog/schema.ts (aboutPageSchema). docs/blog.md describes the fields.
# Headings marked "screen readers only" give each section its H2 without showing on the page.

meta:
  title: "Tentang Kami: Cerita Fadil & Ratu"   # rendered as "<title> | Nice Mice"
  description: "Nice Mice lahir dari gemasnya kami mencari undangan digital untuk pernikahan sendiri. Kenalan dengan Fadil & Ratu, pasangan di balik undangan tema film."
  ogImage: /images/about/fadil-ratu-og.webp   # link previews only (1200x630, from the same photo); alt is hero.photoAlt

hero:
  label: "Cerita Kami"
  h1: "Awalnya cuma gemas sama undangan nikahan sendiri."
  intro: "Kami Fadil dan Ratu, pasangan suami istri di balik Nice Mice. Kami bikin undangan digital yang terasa seperti cerita kalian sendiri, dan menyiapkannya sampai siap disebar."
  photo: /images/about/fadil-ratu.webp   # from content/images-src/about/fadil-ratu.jpg
  photoAlt: "Fadil dan Ratu, pasangan di balik Nice Mice, duduk berdua di bangku taman"

timeline:
  heading: "Perjalanan Nice Mice"   # screen readers only
  steps:
    - heading: "Ratu, si tukang rencana"
      text: "Dari dulu Ratu punya banyak ide bisnis, dari pernak-pernik aksesoris sampai macam-macam lainnya. Sayangnya, semuanya selalu berhenti di rencana."
    - heading: "Lucu, tapi belum “kita banget”"
      text: "Waktu menyiapkan pernikahan, kami keliling mencari undangan digital. Banyak yang lucu, tapi Ratu, yang latar belakangnya desain grafis, terus merasa ini masih bisa lebih bagus, dan lebih terasa “kita”."
    - heading: "“Ah, ini mah I can.”"
      text: "Akhirnya kami tetap pakai jasa undangan digital lain, dan hasilnya bagus. Tapi kalimat itu sudah terucap. Lalu kebiasaan lama hampir kambuh: idenya mengendap seminggu, dua minggu, dan nyaris terlupa."
    - heading: "Fadil ikut yakin"
      text: "Melihat Ratu begitu pede soal desain undangannya, Fadil ikut yakin. Daripada idenya terlupa lagi, Fadil menawarkan diri membangun websitenya. Kata Ratu sih, menawarkan diri untuk dieksploitasi. Ratu mendesain, Fadil membangun, dan lahirlah Nice Mice: rencana Ratu pertama yang benar-benar jalan."
    - heading: "Mulai dari yang kami suka: film"
      text: "Kami hobi nonton film, jadi koleksi pertama kami adalah tema film: Friends, La La Land, The Notebook, dan Crazy Little Thing Called Love. Film baru permulaan. Nanti akan ada tema lain, apa pun yang bikin pasangan merasa “ini cerita kita”."

values:
  heading: "Yang kami pegang"
  items:
    - title: "Harga jelas dari awal"
      text: "Paket, harga, dan apa saja yang termasuk sudah tertulis sebelum kamu bayar. Tidak ada biaya kejutan."
    - title: "Terima beres"
      text: "Kamu pilih tema dan kirim detail acara. Sisanya kami siapkan sampai link-nya siap disebar."
    - title: "Terasa kalian banget"
      text: "Setiap tema dirancang supaya undangan terasa seperti cerita kalian, bukan template yang sama dengan semua orang."
    - title: "Praktis untuk tamu"
      text: "Nama tamu, RSVP, peta, dan amplop digital ada dalam satu link yang tinggal dibuka dari WhatsApp."

# Each person is /tentang-kami#<slug>, the address their entry in content/authors.json links to.
team:
  heading: "Orang di balik Nice Mice"
  people:
    - slug: ratu
      name: "Ratu"
      role: "Desainer"
      bio: "Berlatar belakang desain grafis. Ratu mendesain setiap tema undangan Nice Mice, dan dialah yang pertama kali bilang “ah, ini mah I can”."
      photo: /images/about/ratu-avatar.webp   # round avatar: square 400x400, from content/images-src/about/ratu.jpeg; null shows the initial
      photoAlt: "Ratu, desainer Nice Mice, tersenyum sambil memberi salam hormat di dek kayu"
      accent: lime   # the circle behind the avatar: lime or red
      badge: brush   # the sticker on the avatar: brush (designs) or code (builds)
    - slug: fadil
      name: "Fadil"
      role: "Pembangun website & animasi"
      bio: "Fadil yang mengubah desain Ratu jadi undangan yang bisa dibuka dan disebar. Dia membangun website Nice Mice dan membuat animasi di setiap undangannya."
      photo: /images/about/fadil-avatar.webp   # from content/images-src/about/fadil.jpeg
      photoAlt: "Fadil, pembangun website Nice Mice, berdiri di jalan setapak taman"
      accent: red
      badge: code


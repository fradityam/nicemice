closing:
  heading: "Sekarang, giliran cerita kalian."
  text: "Pilih tema yang paling terasa seperti kalian, atau ngobrol dulu dengan kami lewat WhatsApp."
  primaryCta: { label: "Lihat Tema", href: "/#tema" }
  whatsappLabel: "Chat lewat WhatsApp"   # the usual order message; hidden while there's no WhatsApp number

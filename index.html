<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Absolute paths, so couple pages (/radit-ratu) and demos (/template/...) share the icons. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- This page's fonts only (src/content/fonts.ts): the homepage's here; the Worker swaps in
         a template's on its pages. -->
    <link data-fonts href="%HOME_FONTS%" rel="stylesheet" />
    <!-- The homepage's title and description, filled in from src/content/seo.ts (see vite.config.ts).
         On the template demos the Worker (worker/index.ts) swaps in their own and adds a canonical. -->
    <title>%HOME_TITLE%</title>
    <meta name="description" content="%HOME_DESCRIPTION%" />
    <!-- Link previews (WhatsApp, …). On a couple's page the Worker (worker/index.ts) swaps in
         their names, date and photo. Image URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nice Mice" />
    <meta property="og:title" content="%HOME_TITLE%" />
    <meta property="og:description" content="%HOME_DESCRIPTION%" />
    <meta property="og:image" content="https://nicemice.id/og-default.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nice Mice" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Google Analytics 4 (ID from src/config.ts), on nicemice.id only. Google's script loads
         after the page has finished loading, so it never delays the first paint; until then
         events wait in dataLayer. The app sends page views itself (src/analytics.ts), and
         the address never includes ?to= (the guest's name). -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      if (location.hostname === 'nicemice.id') {
        var gaPage = new URL(location.href);
        gaPage.searchParams.delete('to');
        gaPage.hash = '';
        gtag('js', new Date());
        gtag('config', '%GA_ID%', { send_page_view: false, page_location: gaPage.href });
        addEventListener('load', function () {
          (window.requestIdleCallback || setTimeout)(function () {
            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://www.googletagmanager.com/gtag/js?id=%GA_ID%';
            document.head.appendChild(s);
          });
        });
      } else {
        window.gtag = undefined;
      }
    </script>
  </head>
  <body class="bg-[#FAF9F6] text-zinc-800 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
